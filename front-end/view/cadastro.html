<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/cadastro.css?V1.0">
  <title>Cadastro</title>
</head>

<body>
  <header></header>
  <main>
    <div class="logosenai">
      <img src="../assets/logo_senai.png" alt="logosenai" p>
      <h1>Formando quem forma a indústria.</h1>
    </div>

    <div class="formulariocadastro">
      <form id="formCadastro">
        <div class="input-container">
          <i class="bi bi-person"></i>
          <input type="text" name="nome" id="nome" placeholder="Nome">
        </div>

        <div class="input-container">
          <i class="bi bi-envelope"></i>
          <input type="email" name="email" id="email" placeholder="Email">
        </div>

        <div class="input-container">
          <i class="bi bi-lock"></i>
          <input type="password" name="senha" id="senha" placeholder="Senha">
        </div>
        <!-- Dropdown Cargo -->
        <div class="select-container">
          <i class="bi bi-briefcase"></i>
          <select name="cargo" id="cargo">
            <option value="" disabled selected>Selecione o cargo</option>
            <option value="1">Gestor</option>
            <option value="2">Colaborador</option>
          </select>
        </div>

        <div class="button">
        <button type="submit">CADASTRAR</button>
      </div>
      </form>
    </div>
  </main>
  <script>
    document.getElementById("formCadastro").addEventListener("submit", async function (e) {
      e.preventDefault(); // impede recarregar a página

      const nome = document.getElementById("nome").value;
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;
      const cargo = document.getElementById("cargo").value;

      // Monta o JSON esperado pelo PHP
      const data = {
        usuario_nome: nome,
        usuario_email: email,
        senha: senha,
        usuario_nivel: cargo,   // corresponde ao select
        usuario_del: "ativo"
      };

      try {
        const response = await fetch("../../back-end/Post/Post_usuario.php", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.status === "success") {
          alert("✅ " + result.message);
          window.location.href = "home_admin.html";
          document.getElementById("formCadastro").reset();
           
        } else {
          alert("❌ " + result.message);
        }
      } catch (error) {
        alert("⚠️ Erro na requisição: " + error.message);
      }
    });
  </script>



</body>

</html>
