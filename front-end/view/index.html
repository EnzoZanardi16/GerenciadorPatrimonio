<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css?V1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Login</title>
</head>

<body>
    <header></header>

    <main>
        <div class="logosenai">
            <img src="../assets/logo_senai.png" alt="logosenai" p>
            <h1>Formando quem forma a indústria.</h1>
        </div>


        <div class="formulariologin">
            <form id="formLogin">
                <div class="input-container">
                    <i class="bi bi-envelope"></i>
                    <input type="email" name="email" id="email" placeholder="Email">
                </div>

                <div class="input-container">
                    <i class="bi bi-lock"></i>
                    <input type="password" name="senha" id="senha" placeholder="Senha">
                </div>

                <div class="esqueci-senha">
                    <a href="">Esqueci minha senha</a>
                </div>

                <div class="button">
                    <button type="submit">ENTRAR</button>
                </div>
            </form>
        </div>
    </main>



    <script>
        document.getElementById("formLogin").addEventListener("submit", async function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value; // seu PHP atual ainda não valida senha

            const data = {
                email: email,
                senha: senha
            };

            try {
                const response = await fetch("../../back-end/Post/LoginSSO.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.status === "success") {
                    alert("✅ " + result.message);

                    // salva token no navegador
                    localStorage.setItem("token", result.token);
                    localStorage.setItem("user", JSON.stringify(result.user));

                    // redireciona para a home (ajuste o destino)
                    window.location.href = "home_admin.html";
                } else {
                    alert("❌ " + result.message);
                }
            } catch (error) {
                alert("⚠️ Erro na requisição: " + error.message);
            }
        });
    </script>

</body>

</html>
